name: PHPUnit

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-version: '7.0'
            phpunit-config: phpunit_pre73.xml

          - php-version: '7.1'
            phpunit-config: phpunit_pre73.xml

          - php-version: '7.2'
            phpunit-config: phpunit_pre73.xml

          - php-version: '7.3'
            phpunit-config: phpunit.xml

          - php-version: '7.4'
            phpunit-config: phpunit.xml

          - php-version: '8.0'
            phpunit-config: phpunit.xml

          - php-version: '8.1'
            phpunit-config: phpunit.xml

          - php-version: '8.2'
            phpunit-config: phpunit.xml

          - php-version: '8.3'
            phpunit-config: phpunit.xml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies with Composer
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Create PHPUnit results directory
        run: mkdir -p test-results/phpunit

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration ${{ matrix.phpunit-config }} --log-junit test-results/phpunit/junit_${{ matrix.php-version }}.xml

      - name: Capture logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.php-version }}
          path: test-results/**/*
